<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <title>Madring · Circuito de Madring</title>
        <meta
            name="description"
            content="What does one lap of the Madring hold? Twenty-two corners read as the transport network they sit inside, with a layer for overtaking, danger, banking, gradient and 2026 aero modes."
        />
        <!-- Share cards. The image is drawn from the same bundle and tokens as the page by
             `pnpm og`; scrapers need the absolute URL, so it names the Pages address directly.
             The theme colours repeat content/theme.json's two papers, the one place tokens are
             quoted outside the generated stylesheet. -->
        <link rel="canonical" href="https://rushi.github.io/madring/" />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Madring" />
        <meta property="og:title" content="Madring · Circuito de Madring" />
        <meta
            property="og:description"
            content="What does one lap of the Madring hold? Twenty-two corners read as the transport network they sit inside, with a layer for overtaking, danger, banking, gradient and 2026 aero modes."
        />
        <meta property="og:url" content="https://rushi.github.io/madring/" />
        <meta property="og:image" content="https://rushi.github.io/madring/og.png" />
        <meta property="og:image:width" content="2400" />
        <meta property="og:image:height" content="1260" />
        <meta
            property="og:image:alt"
            content="The Madring lap drawn as one dark road with twenty-two numbered corner stations, over a MADRING wordmark."
        />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F6F3EE" />
        <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E1218" />
        <!-- Fonts before the data: the page is drawn from the HTML now, so what decides when it
             stops changing shape is the faces that text is set in, not the bundle behind it. -->
        <link rel="preload" href="%BASE_URL%fonts/anybody-sign.woff2" as="font" type="font/woff2" crossorigin />
        <link rel="preload" href="%BASE_URL%fonts/archivo-text.woff2" as="font" type="font/woff2" crossorigin />
        <link
            rel="preload"
            href="%BASE_URL%fonts/saira-condensed-700.woff2"
            as="font"
            type="font/woff2"
            media="(width < 560px), (height < 560px)"
            crossorigin
        />
        <!--data-preload-->
        <!--analytics-->
        <style>
            /* Declared here so the faces are known before any stylesheet loads, and so the
               Pages base path resolves through %BASE_URL% rather than a root-absolute URL. */
            @font-face {
                font-family: "Anybody";
                src: url("%BASE_URL%fonts/anybody-sign.woff2") format("woff2-variations");
                font-weight: 100 900;
                font-stretch: 50% 150%;
                font-display: swap;
            }
            @font-face {
                font-family: "Archivo";
                src: url("%BASE_URL%fonts/archivo-text.woff2") format("woff2-variations");
                font-weight: 100 900;
                font-display: swap;
            }
            @font-face {
                font-family: "Saira Condensed";
                src: url("%BASE_URL%fonts/saira-condensed-700.woff2") format("woff2");
                font-weight: 700;
                font-display: swap;
            }
            /*
             * The faces the page falls back to while the real ones load, bent to the metrics of the
             * ones they stand in for. Measured against Arial: Archivo sets 97.85% as wide and
             * Anybody 91.49%, so without this the text reflows the moment a face arrives. The
             * standfirst is the largest thing on the page, which makes that reflow the moment the
             * browser calls the largest paint, and it is what moved the figure from 0.7s to 2.7s.
             */
            @font-face {
                font-family: "Archivo Fallback";
                src: local("Arial");
                size-adjust: 97.85%;
                ascent-override: 88%;
                descent-override: 21%;
                line-gap-override: 0%;
            }
            @font-face {
                font-family: "Anybody Fallback";
                src: local("Arial");
                size-adjust: 91.49%;
                ascent-override: 79%;
                descent-override: 24%;
                line-gap-override: 0%;
            }
        </style>
        <script>
            /* Before first paint, or the page shows the OS palette and then swaps to the stored
               choice. Kept inline and tiny for that reason; the module bundle is far too late. */
            try {
                var stored = localStorage.getItem("madring.theme");
                if (stored === "light" || stored === "dark") {
                    document.documentElement.setAttribute("data-theme", stored);
                }
            } catch (ignored) {}
        </script>
    </head>
    <body>
        <div id="root"></div>
        <!--lap-seed-->
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
